<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}beet-scheduler{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">
      <img src="/static/favicon.svg" alt="" width="24" height="24" class="site-logo-icon">
      beet-scheduler
    </a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a href="https://github.com/miikka/beet-scheduler">
      <picture>
        <source srcset="/static/powered-by-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="/static/powered-by.svg" width="88" height="31" alt="Powered by beet-scheduler">
      </picture>
    </a>
  </footer>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  {% block scripts %}{% endblock %}
  {{ html_snippet | safe }}
</body>
</html>
